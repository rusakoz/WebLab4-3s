//historyForBuild
tasks.register('hb') {
    mustRunAfter compileProject
    doLast{
        if (compileJava.state.failure != null) {
            println 'omg'
            def col = ['1', '2', '3', '4']
            col.any { count ->
                println count + 'lox'
                def result = exec{
                    ignoreExitValue true
                    commandLine 'gradlew.bat', 'compileProject'
                }
                if(result.exitValue == 0){
                    println ' > [TASK HISTORY]: RECompile Project: Success! yep yep'
                    exec{
                        ignoreExitValue true
                        commandLine 'gradlew.bat', 'buildProject'
                    }
                    true
                }else{
                    println ' > [TASK HISTORY]: RECompile Project: lose! :('
                }
            }
        }
        println 'History build'
    }
}

bootJar {
    mustRunAfter hb
    doLast{
        println 'bootJar'
    }
}

//build
task buildProject(type: Jar) {
    description 'build project'
    dependsOn 'compileProject'
    dependsOn 'hb'
    dependsOn 'bootJar'
    archiveFileName = 'WebLab4Application.jar'
    from sourceSets.main.output
    manifest {
        attributes(
                'Main-Class': 'org.lab4.wed.weblab4.WebLab4Application',
        )
    }
    doLast{
        println 'opopopopop'
    }
    
}

