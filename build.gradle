//compile
tasks.register('compileProject') {
    description = 'compile project'
    dependsOn 'classes'
    doLast{
        println 'Compile project...'
    }
}


//historyForCompile
tasks.register('hc') {
    mustRunAfter compileProject
    doLast{
        if (compileJava.state.failure != null) {
            def stash = 'git stash'.execute()
            stash.waitFor()

            def currentCommit = 'git rev-parse HEAD'.execute()
            currentCommit.waitFor()
            def currentBranch = 'git rev-parse --abbrev-ref HEAD'.execute()
            currentBranch.waitFor()
            def commitList = 'git rev-list HEAD'.execute()
            commitList.waitFor()

            println 'omg'
            if(stash.exitValue() == 0 && currentCommit.exitValue() == 0 && currentBranch.exitValue() == 0 && commitList.exitValue() == 0){
                currentCommit = currentCommit.text
                currentBranch = currentBranch.text
                commitList = commitList.text.split("\n")
                commitList.any { rev ->
                    println rev + 'lox'

                    def gitCheckoutBranch = 'git checkout ' + rev
                    gitCheckoutBranch.execute().waitFor()

                    def result = exec{
                        ignoreExitValue true
                        commandLine 'gradlew.bat', 'compileProject'
                    }

                    if(result.exitValue == 0){
                        def strGitDiffCommand = 'powershell git diff ' + commitList[0].toString() + ' ' + commitList[2].toString() + ' > build/diff.txt'
                        def gitDiff = strGitDiffCommand.execute().waitFor()

                        println ' > [TASK HISTORY]: RECompile Project: Success! yep yep'
                        true
                    }else{
                        println ' > [TASK HISTORY]: RECompile Project: lose! :('
                    }
                }
            }else{
                println ' > [TASK HISTORY COMPILE]: FAILURE'
            }
            def gitCheckoutBranch = 'git checkout ' + currentBranch
            gitCheckoutBranch.execute().waitFor()
            if(stash.exitValue() == 0){
                def stashPop = 'git stash pop'.execute().waitFor()
            }
        }
        println 'History compile'
    }
}

